<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Easy BPM production architecture</title>
  <desc id="desc">Easy BPM production deployment with users, ingress, web applications, backend replicas, worker replicas, PostgreSQL, RabbitMQ, identity, observability, and external services.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6b82"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .band { fill: #f6f9ff; stroke: #dbe6ff; stroke-width: 1.5; }
      .title { font: 700 28px Inter, Arial, sans-serif; fill: #141926; }
      .subtitle { font: 500 15px Inter, Arial, sans-serif; fill: #5d6b82; }
      .group-title { font: 700 15px Inter, Arial, sans-serif; fill: #111611; letter-spacing: .5px; }
      .box { fill: #ffffff; stroke: #cdd9f0; stroke-width: 2; rx: 10; }
      .box-green { fill: #eef5ff; stroke: #0b5cff; }
      .box-blue { fill: #e7f0ff; stroke: #004fe6; }
      .box-gold { fill: #f8fbff; stroke: #6ea2ff; }
      .box-red { fill: #f7f9fc; stroke: #111827; }
      .box-gray { fill: #ffffff; stroke: #a8b6cf; }
      .label { font: 700 17px Inter, Arial, sans-serif; fill: #111611; }
      .note { font: 500 13px Inter, Arial, sans-serif; fill: #5d6b82; }
      .small { font: 600 12px Inter, Arial, sans-serif; fill: #5d6b82; }
      .line { fill: none; stroke: #5d6b82; stroke-width: 2.2; marker-end: url(#arrow); }
      .line-soft { fill: none; stroke: #96a7c3; stroke-width: 1.8; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <rect x="1168" y="30" width="56" height="56" rx="14" fill="#0b5cff"/>
  <circle cx="1190" cy="58" r="10" fill="none" stroke="#ffffff" stroke-width="5"/>
  <path d="M1202 58 H1218" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <text class="title" x="48" y="58">Easy BPM production architecture</text>
  <text class="subtitle" x="48" y="86">Stateless application replicas around PostgreSQL and RabbitMQ as the production data plane.</text>

  <rect class="band" x="44" y="124" width="206" height="520" rx="16"/>
  <text class="group-title" x="70" y="158">ACCESS</text>
  <rect class="box box-green" x="70" y="188" width="154" height="72" rx="10"/>
  <text class="label" x="147" y="218" text-anchor="middle">Users</text>
  <text class="note" x="147" y="242" text-anchor="middle">Operators and apps</text>
  <rect class="box box-blue" x="70" y="330" width="154" height="82" rx="10"/>
  <text class="label" x="147" y="362" text-anchor="middle">HTTPS ingress</text>
  <text class="note" x="147" y="386" text-anchor="middle">TLS and routing</text>

  <rect class="band" x="304" y="124" width="260" height="520" rx="16"/>
  <text class="group-title" x="330" y="158">WEB APPS</text>
  <rect class="box box-gray" x="336" y="188" width="196" height="72" rx="10"/>
  <text class="label" x="434" y="218" text-anchor="middle">Modeler</text>
  <text class="note" x="434" y="242" text-anchor="middle">Processes, forms, agents</text>
  <rect class="box box-gray" x="336" y="330" width="196" height="72" rx="10"/>
  <text class="label" x="434" y="360" text-anchor="middle">Admin Console</text>
  <text class="note" x="434" y="384" text-anchor="middle">Operations and incidents</text>
  <rect class="box box-gray" x="336" y="472" width="196" height="72" rx="10"/>
  <text class="label" x="434" y="502" text-anchor="middle">Task Portal</text>
  <text class="note" x="434" y="526" text-anchor="middle">Human tasks</text>

  <rect class="band" x="618" y="124" width="252" height="520" rx="16"/>
  <text class="group-title" x="644" y="158">RUNTIME</text>
  <rect class="box box-blue" x="650" y="238" width="188" height="92" rx="10"/>
  <text class="label" x="744" y="274" text-anchor="middle">Backend API</text>
  <text class="note" x="744" y="299" text-anchor="middle">2+ replicas</text>
  <rect class="box box-green" x="650" y="424" width="188" height="92" rx="10"/>
  <text class="label" x="744" y="460" text-anchor="middle">Worker pool</text>
  <text class="note" x="744" y="485" text-anchor="middle">2+ replicas</text>

  <rect class="band" x="924" y="124" width="302" height="520" rx="16"/>
  <text class="group-title" x="950" y="158">DATA PLANE</text>
  <rect class="box box-gold" x="956" y="206" width="238" height="92" rx="10"/>
  <text class="label" x="1075" y="242" text-anchor="middle">PostgreSQL</text>
  <text class="note" x="1075" y="267" text-anchor="middle">State, variables, tasks, audit</text>
  <rect class="box box-gold" x="956" y="382" width="238" height="92" rx="10"/>
  <text class="label" x="1075" y="418" text-anchor="middle">RabbitMQ</text>
  <text class="note" x="1075" y="443" text-anchor="middle">Requests, retries, completions</text>

  <rect class="box box-red" x="956" y="542" width="238" height="66" rx="10"/>
  <text class="label" x="1075" y="570" text-anchor="middle">External services</text>
  <text class="note" x="1075" y="592" text-anchor="middle">APIs and AI providers</text>

  <rect class="box box-gray" x="650" y="670" width="188" height="50" rx="10"/>
  <text class="small" x="744" y="700" text-anchor="middle">Metrics, logs, alerts</text>
  <rect class="box box-gray" x="336" y="670" width="196" height="50" rx="10"/>
  <text class="small" x="434" y="700" text-anchor="middle">OIDC or Keycloak</text>

  <path class="line" d="M147 260 L147 330"/>
  <path class="line" d="M224 371 L336 224"/>
  <path class="line" d="M224 371 L336 366"/>
  <path class="line" d="M224 371 L336 508"/>
  <path class="line" d="M532 224 L650 274"/>
  <path class="line" d="M532 366 L650 284"/>
  <path class="line" d="M532 508 L650 294"/>
  <path class="line" d="M838 273 L956 252"/>
  <path class="line" d="M838 304 L956 428"/>
  <path class="line" d="M956 428 L838 470"/>
  <path class="line" d="M838 470 L956 252"/>
  <path class="line" d="M838 470 L956 575"/>
  <path class="line-soft dash" d="M744 330 L744 424"/>
  <path class="line-soft dash" d="M744 516 L744 670"/>
  <path class="line-soft dash" d="M650 284 L532 670"/>
</svg>
